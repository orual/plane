[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plane-hw-preview"
version = "0.1.0"
description = "Plane hardware preview pipeline for KiCad render uploads and issue comments"
requires-python = ">=3.10"
license = {text = "AGPL-3.0-or-later"}
authors = [{name = "Plane", email = "support@plane.so"}]

dependencies = [
    "httpx>=0.27",
    "click>=8.0",
    "pyyaml>=6.0",
    "tenacity>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "respx>=0.21",
    "pytest-cov>=4.0",
]

[project.scripts]
plane-preview = "plane_preview.cli:main"

[tool.setuptools.package-data]
plane_preview = ["templates/*.yaml", "templates/*.yml"]

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["plane_preview"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
markers = [
    "unit: unit tests",
    "smoke: smoke tests",
]
